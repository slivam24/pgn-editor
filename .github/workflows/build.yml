name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Sestavit
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "pgn-editor-$VER.apk"

      - name: Uložit mezi artefakty
        uses: actions/upload-artifact@v4
        with:
          name: pgn-editor-${{ env.VER }}
          path: pgn-editor-*.apk

      - name: Zveřejnit ke stažení (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: PGN editor ${{ env.VER }} (sestavení ${{ github.run_number }})
          files: pgn-editor-*.apk
