name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Sestavit
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "pgn-editor-$VER.apk"

      - name: Uložit mezi artefakty
        uses: actions/upload-artifact@v4
        with:
          name: pgn-editor-${{ env.VER }}
          path: pgn-editor-*.apk

      - name: Náhled obrazovky
        continue-on-error: true
        run: |
          P="$PWD/app/src/main/assets/www/index.html"
          for v in "nahled:" "nahled-menu:#menu"; do
            google-chrome --headless=new --no-sandbox --hide-scrollbars --force-device-scale-factor=2 \
              --window-size=412,915 --virtual-time-budget=3000 --screenshot="${v%%:*}.png" "file://$P${v#*:}"
          done

      - name: Uložit náhled
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nahled-${{ env.VER }}
          path: nahled*.png

      - name: Zveřejnit ke stažení (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: PGN editor ${{ env.VER }} (sestavení ${{ github.run_number }})
          files: pgn-editor-*.apk
