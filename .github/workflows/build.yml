name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sestavení z hlavní větve je běžné vydání, z ostatních větví zkušební
      ZKUSEBNI: ${{ github.ref_name != github.event.repository.default_branch }}
      MA_KLIC: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Když testy neprojdou, APK se nesestaví
      - name: Testy PGN
        run: node --test tests/pgn.test.js tests/verze.test.js

      - name: Testy v prohlížeči
        run: |
          cd tests && npm init -y >/dev/null && npm install --silent puppeteer-core@23 && cd ..
          node tests/prohlizec.js

      # Podpisový klíč je v tajném úložišti GitHubu (Settings, Secrets and variables, Actions), viz README.
      - name: Podpisový klíč z tajného úložiště
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ "$MA_KLIC" != "true" ]; then
            echo "::error::Chybí podpisový klíč. V nastavení repozitáře (Secrets and variables, Actions) musí být KEYSTORE_BASE64, KEYSTORE_PASSWORD a KEY_ALIAS, viz README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/podpis.keystore"
          echo "PGN_KEYSTORE_FILE=$RUNNER_TEMP/podpis.keystore" >> "$GITHUB_ENV"

      - name: Sestavit
        env:
          PGN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "pgn-editor-$VER.apk"
          # balíček pro Google Play
          cp app/build/outputs/bundle/release/app-release.aab "pgn-editor-$VER.aab"

      - name: Uložit mezi artefakty
        uses: actions/upload-artifact@v4
        with:
          name: pgn-editor-${{ env.VER }}
          path: |
            pgn-editor-*.apk
            pgn-editor-*.aab

      - name: Náhled obrazovky
        continue-on-error: true
        run: |
          python3 -m http.server 8000 --directory app/src/main/assets/www >/dev/null 2>&1 &
          cd .github/nahled && npm init -y >/dev/null && npm install --silent puppeteer-core@23 && cd ../..
          node .github/nahled/nahled.js
          cat nahled-log.txt

      - name: Uložit náhled (vydání nahled)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nahled >/dev/null 2>&1 || gh release create nahled --prerelease --title "Náhled obrazovky (jen pro kontrolu)" --notes "Automatické snímky obrazovky z posledního sestavení."
          gh release upload nahled nahled*.png nahled-log.txt --clobber

      - name: Zveřejnit ke stažení (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: PGN editor ${{ env.VER }}${{ env.ZKUSEBNI == 'true' && ' zkušební' || '' }} (sestavení ${{ github.run_number }})
          prerelease: ${{ env.ZKUSEBNI == 'true' }}
          target_commitish: ${{ github.sha }}
          body: Do telefonu se instaluje soubor s koncovkou .apk. Soubor .aab je balíček pro Google Play.
          files: |
            pgn-editor-*.apk
            pgn-editor-*.aab

      # Zkušebních sestavení zůstává posledních pět, starší se mažou. Běžných vydání se to netýká.
      - name: Uklidit stará zkušební sestavení
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9.]+-[0-9]+$")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done

  # Zkoušky na emulátoru Androidu: obal aplikace, skutečný WebView, soubory a paměť telefonu.
  # Běží vedle sestavení, takže APK je k dispozici, i kdyby emulátor na GitHubu zrovna nenaběhl.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Povolit rychlý emulátor (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Zkoušky na emulátoru
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew installDebug --no-daemon
            adb shell am start -n cz.sachy.pgneditor/.MainActivity
            sleep 12
            adb exec-out screencap -p > emulator.png
            ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Uložit snímek z emulátoru a výsledky zkoušek
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nahled >/dev/null 2>&1 || gh release create nahled --prerelease --title "Náhled obrazovky (jen pro kontrolu)" --notes "Automatické snímky obrazovky z posledního sestavení."
          find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} + > emulator-zkousky.xml 2>/dev/null || true
          for f in emulator.png emulator-zkousky.xml; do [ -s "$f" ] && gh release upload nahled "$f" --clobber; done
