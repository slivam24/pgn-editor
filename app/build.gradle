plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.sachy.pgneditor'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.sachy.pgneditor'
        minSdk 26          // Android 8.0 a novější
        targetSdk 34
        // S každou novou verzí zvýšit obě čísla (stejně jako v O aplikaci)
        versionCode 9
        versionName '0.9'
    }

    // Stálý podpisový klíč, aby šlo novou verzi nainstalovat přes starou bez ztráty dat
    signingConfigs {
        release {
            storeFile file('pgn-editor.keystore')
            storePassword 'pgneditor'
            keyAlias 'pgn-editor'
            keyPassword 'pgneditor'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
